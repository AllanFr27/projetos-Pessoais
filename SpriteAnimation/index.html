<!DOCTYPE html>
<html lang="pt br">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles/style.css">
        <title>sprite animation</title>
    </head>
    <body>
        <img id="character">
        <div id="container">
            
            <div id="controls">
                <p>Play Animation:</p>
                <input type="radio" name="animation" id="idle" checked>
                <label id="idle">idle</label>
                <input type="radio" name="animation" id="lookUp" checked>
                <label id="lookUp">look-up</label>
                <input type="radio" name="animation" id="lookDown" checked>
                <label id="lookDown">look-down</label>
                <input type="radio" name="animation" id="walking" checked>
                <label id="walking">walking</label><br>
                <input type="radio" name="animation" id="jogging" checked>
                <label id="jogging">jogging</label>
                <input type="radio" name="animation" id="running" checked>
                <label id="running">running</label>
                <input type="radio" name="animation" id="dash" checked>
                <label id="dash">dash</label>
                <input type="radio" name="animation" id="peelout" checked>
                <label id="peelout">peelout</label><br>
                <input type="radio" name="animation" id="jump" checked>
                <label id="jump">jump</label>
                <input type="radio" name="animation" id="spring" checked>
                <label id="spring">spring</label>
                <input type="radio" name="animation" id="spring2" checked>
                <label id="spring2">spring-2</label>
                <input type="radio" name="animation" id="skid" checked>
                <label id="skid">skid</label><br>
                <input type="radio" name="animation" id="spinDash" checked>
                <label id="spinDash">spindash</label>
                <input type="radio" name="animation" id="dropDash" checked>
                <label id="dropDash">dropdash</label>
                <input type="radio" name="animation" id="push" checked>
                <label id="push">push</label>
                <input type="radio" name="animation" id="hurt" checked>
                <label id="hurt">hurt</label>
                <input type="radio" name="animation" id="die" checked>
                <label id="die">die</label><br>
                <input type="radio" name="animation" id="drown" checked>
                <label id="drown">drown</label>
            </div>
            <canvas id="canvas1"></canvas>
        </div>
        <script type="module" src="scripts/main.js"></script>
    </body>
</html>
